suite: render
templates:
  - templates/deployment.yaml
  - templates/service.yaml
  - templates/ingress.yaml
tests:
  - it: renders with minimal values
    set:
      ingress.host: colors.example.com
    asserts:
      - notFailedTemplate: {}
      - equal:
          path: spec.tls[0].secretName
          value: blue-tls
        template: templates/ingress.yaml
  - it: uses configured TLS secret name
    set:
      ingress.host: colors.example.com
      ingress.tls.secretName: custom-tls
    asserts:
      - equal:
          path: spec.tls[0].secretName
          value: custom-tls
        template: templates/ingress.yaml
